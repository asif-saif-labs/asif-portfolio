name: deploy

# Every merge to main: build, upload to S3, invalidate CloudFront.
# AWS access is short-lived, via GitHub OIDC. No AWS keys are stored here.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables),
# from `terraform output` in aslabs-infra/apps/portfolio:
#   AWS_DEPLOY_ROLE_ARN   deploy_role_arn
#   SITE_BUCKET           bucket_name
#   CLOUDFRONT_ID         distribution_id
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to request the OIDC token

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://asif.aslabs.co.in
    env:
      AWS_REGION: ap-south-1
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_ID: ${{ vars.CLOUDFRONT_ID }}
    steps:
      - name: Check deploy settings
        run: |
          for v in AWS_DEPLOY_ROLE_ARN SITE_BUCKET CLOUDFRONT_ID; do
            [ -n "$(eval echo \$$v)" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (see the comment at the top of deploy.yml)"
            exit 1
          fi
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: asif-portfolio-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed assets (cached for a year)
        run: |
          aws s3 sync dist/_astro "s3://$SITE_BUCKET/_astro" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload pages and everything else (always revalidated)
        run: |
          aws s3 sync dist "s3://$SITE_BUCKET" --delete \
            --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Remove stale hashed assets
        run: aws s3 sync dist/_astro "s3://$SITE_BUCKET/_astro" --delete --size-only

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/*" \
            --query 'Invalidation.Id' --output text
